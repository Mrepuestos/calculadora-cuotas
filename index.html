<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>html{color-scheme:dark;background:#04060A}body{margin:0}[hidden]{display:none!important}</style>
<title>Calculadora de financiación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: columna estrecha para el celular. Logo y título arriba centrados, paneles alineados a la izquierda.
   Look fijo oscuro tomado del logo de CrediFacil: negro, blanco y azul eléctrico. */
:root {
  --bg: #04060A;
  --surface: #0B1017;
  --fg: #F3F7FC;
  --muted: #93A1B5;
  --line: #1B2533;
  --accent: #0A8CFB;
  --accent-text: #4DB0FF;
  --accent-ink: #03101F;
  --accent-soft: #0C2038;
  --ok: #4DD6A0;
  --err: #FF8A8A;
  --font-ui: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 460px; margin: 0 auto; display: grid; gap: 20px; }

header { display: grid; gap: 14px; justify-items: center; text-align: center; }
.logo { width: min(290px, 80%); height: auto; display: block; }
h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 700; text-wrap: balance; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 18px; }

label.field, .legend { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.money { position: relative; }
.money span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-family: var(--font-num); font-size: 22px; color: var(--muted); pointer-events: none; }
.money input {
  width: 100%; height: 58px; padding: 0 14px 0 36px;
  font-family: var(--font-num); font-size: 26px; font-weight: 600; color: var(--fg);
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px;
}
.money input:focus-visible, .seg input:focus-visible + label, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.money input:focus-visible { outline-offset: 0; border-color: var(--accent); }

fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  display: grid; gap: 1px; justify-items: start; padding: 10px 12px; cursor: pointer;
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; min-height: 56px; align-content: center;
}
.seg label b { font-size: 15px; font-weight: 700; }
.seg label small { font-size: 12px; color: var(--muted); }
.seg input:checked + label { background: var(--accent-soft); border-color: var(--accent); }
.seg input:checked + label b { color: var(--accent-text); }

.result { display: grid; gap: 14px; }
.big { display: grid; gap: 2px; }
.big .k { font-size: 13px; font-weight: 600; color: var(--muted); }
.big .v { font-family: var(--font-num); font-size: 52px; line-height: 1.05; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.big .s { font-size: 14px; color: var(--muted); }
.rows { display: grid; gap: 0; border-top: 1px solid var(--line); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.row .k { color: var(--muted); font-size: 14px; }
.row .v { font-family: var(--font-num); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

#app { display: grid; gap: 20px; }
#gate form { display: grid; gap: 12px; }
#gate input { width: 100%; height: 54px; padding: 0 14px; font-family: var(--font-num); font-size: 22px; letter-spacing: .3em; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; }
#gate input:focus-visible { outline: 3px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
#gate .err { color: #FF8A8A; font-size: 13px; min-height: 18px; margin: 0; }
.hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; min-height: 36px; }
.hint.err { color: var(--err); }
.money input::placeholder { font-size: 18px; font-weight: 500; color: var(--muted); }
button.copy {
  width: 100%; min-height: 52px; border: 0; border-radius: 10px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; font-size: 15px;
}
button.copy:disabled { opacity: .45; cursor: not-allowed; }
.msg { font-size: 13px; color: var(--ok); min-height: 18px; margin: -6px 0 0; }
.preview { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 10px 12px; margin: 0; overflow-wrap: anywhere; user-select: all; }

h2 { margin: 0 0 8px; font-size: 14px; font-weight: 700; }
.table { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 0 0 8px; }
th:last-child, td:last-child { text-align: right; }
td { padding: 10px 0; border-top: 1px solid var(--line); }
td.n { font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; }
tr.on td { color: var(--accent-text); font-weight: 700; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: no-preference) { .big .v { transition: opacity .12s; } }
</style>

</head>

    <h1>Calculadora de financiación</h1>
  </header>

  <section class="panel" id="gate" aria-label="Acceso">
    <form id="formgate" autocomplete="off">
      <div>
        <label class="field" for="clave">Clave de acceso</label>
        <input id="clave" type="password" inputmode="numeric" autocomplete="off" placeholder="----">
      </div>
      <p class="err" id="errclave" role="alert"></p>
      <button class="copy" type="submit">Entrar</button>
    </form>
  </section>

  <div id="app" hidden>

  <section class="panel" aria-label="Datos de la venta">
    <div>
      <label class="field" for="precio">Valor del equipo</label>
      <div class="money"><span>$</span><input id="precio" type="text" inputmode="decimal" autocomplete="off" value="100" aria-describedby="ayuda"></div>
    </div>
    <div>
      <label class="field" for="inicialcli">Inicial del cliente</label>
      <div class="money"><span>$</span><input id="inicialcli" type="text" inputmode="decimal" autocomplete="off" placeholder="Mínima" aria-describedby="hint"></div>
      <p class="hint" id="hint" aria-live="polite"></p>
    </div>
    <fieldset>
      <div class="legend">Plazo</div>
      <div class="seg" id="plazos"></div>
    </fieldset>
  </section>

  <section class="panel result" aria-live="polite" aria-label="Resultado">
    <div class="big">
      <div class="k">Cuota quincenal</div>
      <div class="v" id="cuota">-</div>
      <div class="s" id="detalle">Escribe el valor del equipo</div>
    </div>
    <div class="rows">
      <div class="row"><span class="k" id="kinicial">Inicial</span><span class="v" id="inicial">-</span></div>
      <div class="row"><span class="k">Cuotas</span><span class="v" id="ncuotas">-</span></div>
    </div>
    <p class="preview" id="texto">-</p>
    <button class="copy" id="copiar" type="button" disabled>Copiar mensaje para el cliente</button>
    <p class="msg" id="aviso" role="status"></p>
  </section>

  <section class="panel" aria-label="Todos los plazos">
    <div>
      <h2>Comparar los tres plazos</h2>
      <div class="table">
        <table>
          <thead><tr><th>Plazo</th><th>Cuotas</th><th>Cuota quincenal</th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
    </div>
    <p class="note" id="ayuda">Las cuotas se pagan cada 15 días. La inicial y las cuotas se redondean al entero más cercano.</p>
  </section>
  </div>
</div>

<script>
(function () {
  // Política vigente. Para cambiarla, pídele a Claude que actualice estos valores.
  var INICIAL_MIN = 0.5;
  var INICIAL_MAX = 0.7;
  var INTERES_POR_CUOTA = 0.10;
  var PLANES = [
    { meses: 3, cuotas: 6 },
    { meses: 4, cuotas: 8 },
    { meses: 5, cuotas: 10 }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var fmt = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });
  var money = function (n) { return '$' + fmt.format(n); };
  var redondear = function (x) { return Math.round(x + 1e-9); };

  var seleccionado = 0;
  try { var g = parseInt(localStorage.getItem('plazo'), 10); if (g >= 0 && g < PLANES.length) seleccionado = g; } catch (e) {}

  // Selector de plazo
  var cont = $('plazos');
  PLANES.forEach(function (p, i) {
    var inp = document.createElement('input');
    inp.type = 'radio'; inp.name = 'plazo'; inp.id = 'plazo' + i; inp.value = i;
    if (i === seleccionado) inp.checked = true;
    var lab = document.createElement('label');
    lab.setAttribute('for', inp.id);
    lab.innerHTML = '<b>' + p.meses + ' meses</b><small>' + p.cuotas + ' cuotas</small>';
    cont.appendChild(inp); cont.appendChild(lab);
    inp.addEventListener('change', function () {
      seleccionado = i;
      try { localStorage.setItem('plazo', String(i)); } catch (e) {}
      pintar();
    });
  });

  function leerNumero(id) {
    var t = $(id).value.trim().replace(/\s/g, '');
    if (t.indexOf(',') > -1 && t.indexOf('.') > -1) t = t.replace(/\./g, '').replace(',', '.');
    else t = t.replace(',', '.');
    var n = parseFloat(t);
    return (isFinite(n) && n > 0) ? n : 0;
  }
  function leerPrecio() { return leerNumero('precio'); }

  function limites(precio) {
    var min = redondear(precio * INICIAL_MIN);
    var max = Math.floor(precio * INICIAL_MAX + 1e-9);
    if (max < min) max = min;
    return { min: min, max: max };
  }

  function calcular(precio, inicial, p) {
    var financiado = precio - inicial;
    var interes = redondear(financiado * INTERES_POR_CUOTA * p.cuotas);
    var cuota = redondear((financiado + interes) / p.cuotas);
    return { inicial: inicial, cuota: cuota };
  }

  var mensaje = '';
  function vacio(detalle) {
    $('cuota').textContent = '-';
    $('detalle').textContent = detalle;
    $('inicial').textContent = '-';
    $('kinicial').textContent = 'Inicial';
    $('ncuotas').textContent = '-';
    $('texto').textContent = '-';
    $('copiar').disabled = true;
    mensaje = '';
    var tbody = $('tabla'); tbody.innerHTML = '';
    PLANES.forEach(function (q, i) {
      var tr = document.createElement('tr'); if (i === seleccionado) tr.className = 'on';
      tr.innerHTML = '<td>' + q.meses + ' meses</td><td class="n">' + q.cuotas + '</td><td class="n">-</td>';
      tbody.appendChild(tr);
    });
  }

  function pintar() {
    var precio = leerPrecio();
    var p = PLANES[seleccionado];
    var hint = $('hint');
    hint.className = 'hint';

    if (!precio) {
      hint.textContent = 'Escribe primero el valor del equipo.';
      vacio('Escribe el valor del equipo');
      return;
    }

    var lim = limites(precio);
    var txt = $('inicialcli').value.trim();
    var inicial = (txt === '') ? lim.min : redondear(leerNumero('inicialcli'));

    if (inicial < lim.min) {
      hint.className = 'hint err';
      hint.textContent = 'La inicial no puede ser menor a ' + money(lim.min) + '.';
      vacio('Corrige la inicial para ver la cuota');
      return;
    }
    if (inicial > lim.max) {
      hint.className = 'hint err';
      hint.textContent = 'La inicial no puede pasar de ' + money(lim.max) + '.';
      vacio('Corrige la inicial para ver la cuota');
      return;
    }

    hint.textContent = 'Inicial mínima: ' + money(lim.min) + (txt === '' ? '. Se está usando la mínima.' : '.');

    var r = calcular(precio, inicial, p);
    $('cuota').textContent = money(r.cuota);
    $('detalle').textContent = p.cuotas + ' cuotas cada 15 días, en ' + p.meses + ' meses';
    $('inicial').textContent = money(inicial);
    $('kinicial').textContent = 'Inicial';
    $('ncuotas').textContent = p.cuotas;
    mensaje = 'Financiamiento CrediFacil. Equipo de ' + money(precio) + ': inicial de ' + money(inicial) + ' y ' + p.cuotas +
              ' cuotas quincenales de ' + money(r.cuota) + ' (' + p.meses + ' meses).';
    $('texto').textContent = mensaje;
    $('copiar').disabled = false;

    var tbody = $('tabla'); tbody.innerHTML = '';
    PLANES.forEach(function (q, i) {
      var c = calcular(precio, inicial, q);
      var tr = document.createElement('tr'); if (i === seleccionado) tr.className = 'on';
      tr.innerHTML = '<td>' + q.meses + ' meses</td><td class="n">' + q.cuotas + '</td><td class="n">' + money(c.cuota) + '</td>';
      tbody.appendChild(tr);
    });
  }

  $('precio').addEventListener('input', pintar);
  $('inicialcli').addEventListener('input', pintar);

  $('copiar').addEventListener('click', function () {
    var aviso = $('aviso');
    var listo = function () { aviso.textContent = 'Mensaje copiado.'; setTimeout(function () { aviso.textContent = ''; }, 2200); };
    var seleccionarTexto = function () {
      var rango = document.createRange(); rango.selectNodeContents($('texto'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(rango);
      aviso.textContent = 'Mantén presionado el texto y elige Copiar.';
    };
    try {
      navigator.clipboard.writeText(mensaje).then(listo, seleccionarTexto);
    } catch (e) { seleccionarTexto(); }
  });

  pintar();

  // Acceso con clave
  function huella(s) {
    var a = 0xdeadbeef, b = 0x41c6ce57;
    for (var i = 0, c; i < s.length; i++) { c = s.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }
    a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
    b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
    return 4294967296 * (2097151 & b) + (a >>> 0);
  }
  var OK = 7757228494116226;
  function abrir() { $('gate').hidden = true; $('app').hidden = false; }
  var guardado = null;
  try { guardado = localStorage.getItem('acceso'); } catch (e) {}
  if (guardado === String(OK)) { abrir(); } else { $('clave').focus(); }
  $('formgate').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (huella('cf-' + $('clave').value.trim()) === OK) {
      try { localStorage.setItem('acceso', String(OK)); } catch (e) {}
      abrir();
    } else {
      $('errclave').textContent = 'Clave incorrecta. Intenta de nuevo.';
      $('clave').value = ''; $('clave').focus();
    }
  });
})();
</script>
